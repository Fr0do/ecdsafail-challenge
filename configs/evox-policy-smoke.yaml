output_dir: artifacts/runs/evox-policy-smoke-v2
cache:
  dir: artifacts/cache-policy-smoke-v2
evaluator:
  version: ecdsa.fail-v1
  dataset_version: ecdsa.fail-policy-local
target_prog_slots:
  - patch_id
  - DIALOG_GCD_COMPARE_BITS
  - DIALOG_GCD_APPLY_CLEAN_COMPARE_BITS
  - DIALOG_GCD_ACTIVE_ITERATIONS
  - DIALOG_GCD_WIDTH_MARGIN
  - DIALOG_GCD_PA9024_COMPARE_SCHEDULE_MARGIN
  - DIALOG_GCD_APPLY_CHUNKED_F_CUT
  - DIALOG_GCD_APPLY_CHUNKED_F_CUT2
  - DIALOG_REROLL
  - DIALOG_POST_SUB_REROLL
evox:
  population_size: 4
  generations: 2
  evaluation_seeds: [0]
  elite_fraction: 0.5
  immigrant_fraction: 0.5
budgets:
  - name: proxy
    stage: 1
    timeout_s: 240
    max_plans: 0
    max_judges: 0
    env_overrides:
      ECDSAFAIL_EVAL_MODE: build_only
