    stage: 0
    timeout_s: 120
    max_plans: 1
    max_judges: 0
    env_overrides:
      AGENT_BACKEND: openrouter
      AGENT_MODE: plan_only
      AGENT_NUM_PROPOSALS: 4
      AGENT_OPENROUTER_API_KEY_FILE: /Users/mkurkin/experiments/projects/openrouter.txt
      AGENT_MAX_USD: 0.03
