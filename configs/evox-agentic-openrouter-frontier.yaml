output_dir: artifacts/runs/agentic-openrouter-frontier-v1
cache:
  dir: artifacts/cache-agentic-openrouter-frontier-v1
evaluator:
  version: ecdsa.fail-agentic-plan-v7
  dataset_version: ecdsa.fail-local
target_prog_slots:
  - agent_task_id
  - agent_model_lane
evox:
  population_size: 6
  generations: 2
  evaluation_seeds: [0]
  elite_fraction: 0.5
  immigrant_fraction: 0.34
budgets:
